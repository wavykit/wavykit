name: Split packages

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: List packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "packages=$(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  split:
    name: Split ${{ matrix.package }}
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - name: Check the split app configuration
        env:
          CLIENT_ID: ${{ vars.SPLIT_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The SPLIT_APP_CLIENT_ID variable or SPLIT_APP_PRIVATE_KEY secret is not configured; see docs/monorepo.md."
            exit 1
          fi

      # A one-hour installation token limited to this package's split repository.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.package }}
          permission-contents: write
          permission-workflows: write

      # Without persisted GITHUB_TOKEN credentials, the push uses the app token.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and push to the read-only repository
        env:
          SPLIT_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ matrix.package }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          sha="$(git subtree split --prefix="packages/$PACKAGE" HEAD)"

          if [ "$REF_TYPE" = tag ]; then
            target="refs/tags/$REF_NAME"
          else
            target="refs/heads/$REF_NAME"
          fi

          git push "https://x-access-token:${SPLIT_TOKEN}@github.com/${OWNER}/${PACKAGE}.git" "$sha:$target"
